# pnpm configuration for GitLabBar.
#
# WHY THIS FILE EXISTS
#
# pnpm 10+ blocks dependency lifecycle scripts by default. Electron's whole
# install is a `postinstall` that downloads the platform binary and writes its
# location to node_modules/electron/path.txt. With that script blocked, the
# package installs "successfully" and then every `electron-forge` command dies
# with:
#
#   Error: Electron failed to install correctly, please delete
#   node_modules/electron and try installing again
#
# which says nothing about build scripts and sends you deleting node_modules
# in a loop.
#
# `allowBuilds` is a MAP, not a list. Written as a list it is silently ignored
# and you get the error above with a config file that looks correct.
# (The older `onlyBuiltDependencies` setting is the list form; `allowBuilds`
# replaced it in pnpm 10.26. Use one or the other, matching your pnpm version.)
allowBuilds:
  # Downloads the platform binary and writes node_modules/electron/path.txt.
  # Without it every electron-forge command fails at startup.
  electron: true

  # Installs its own platform binary. Vite depends on it (`pnpm why esbuild`
  # shows vite -> @vitejs/plugin-react and vitest), so blocking it breaks both
  # the renderer build and the test run.
  esbuild: true

  # Native image processing, used by scripts/generate-icons.mjs to produce
  # assets/icons/icon.icns and the PNG set. Needed whenever icons are
  # regenerated; without its binary that script throws on import.
  sharp: true

  # Builds Windows installers. forge.config.ts does configure MakerSquirrel,
  # but a Windows installer cannot be produced from macOS or Linux anyway, so
  # its postinstall is dead weight in this project's actual workflow.
  # Flip to true if Windows packaging is ever done on a Windows machine.
  electron-winstaller: false

  # The next two are macOS-only native modules and therefore do not install on
  # Linux at all — they surface only when someone runs `pnpm install` on a Mac,
  # which is where the DMG actually gets built.
  #
  #   @electron-forge/maker-dmg -> appdmg -> fs-xattr
  #   @electron-forge/maker-dmg -> appdmg -> ds-store -> macos-alias
  #
  # appdmg is what produces the .dmg, so both are needed for macOS packaging:
  # fs-xattr writes extended file attributes, macos-alias creates the alias to
  # /Applications that makes the drag-to-install window work. Both compile
  # native bindings, so blocking their scripts leaves them unusable.
  #
  # Not verifiable from Linux — these were added from a Mac's install failure,
  # and only a Mac can confirm the build succeeds.
  fs-xattr: true
  macos-alias: true

# Fail the install outright if any dependency has a lifecycle script that is
# neither allowed above nor explicitly ignored below. Deliberately loud: this
# project has been bitten before by builds being skipped in silence, and an
# install that fails with a name in it costs minutes, where one that succeeds
# and leaves a broken binary costs an evening.
#
# When this fires, `pnpm ignored-builds` prints exactly what was blocked.
# Decide per package: add it to allowBuilds if it genuinely needs to build,
# or to ignoredBuiltDependencies if it does not.
strictDepBuilds: true

# pnpm 11 refuses to resolve TRANSITIVE dependencies from exotic sources — git
# repositories and direct tarball URLs — allowing them only as direct
# dependencies. It is a supply-chain hardening default, and turning it off is a
# real, if narrow, weakening of it.
#
# We have to, and the reason is upstream's, not ours:
#
#   @electron-forge/cli
#     -> @electron-forge/core-utils
#       -> @electron/rebuild
#         -> @electron/node-gyp   (resolved via git-repository)
#
# electron-forge's own dependency chain pulls @electron/node-gyp straight from
# git. Without this, `pnpm install` fails outright with ERR_PNPM_EXOTIC_SUBDEP
# and there is no per-package allowlist for this setting — only the global
# switch.
#
# What this does NOT weaken: `allowBuilds` above still governs which packages
# may execute lifecycle scripts, and that is the setting that actually gates
# arbitrary code execution at install time. This one governs where a package's
# bytes may come from.
#
# Revisit if electron-forge ever ships a registry-resolved node-gyp.
blockExoticSubdeps: false

# electron-forge REQUIRES a flat node_modules. Its preflight check
# (@electron-forge/cli/src/util/check-system.ts) literally runs
# `pnpm config get node-linker` and throws unless the answer is exactly
# "hoisted" — packaging needs real directories on disk, not pnpm's symlinked
# virtual store.
#
# Note this setting lives HERE, not in .npmrc, despite what forge's own error
# message says. pnpm 10+ moved settings into this file; verified with
# `pnpm config get node-linker`, which reads it from here and answers
# "hoisted".
#
# The cost is real and worth naming: hoisting gives up pnpm's strict isolation,
# so a package can once again import something it never declared. That is the
# npm behaviour we came from, not a regression — but it means pnpm is being
# used here for its store, its lockfile and its build-script gating, not for
# dependency strictness.
nodeLinker: hoisted

name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint
        continue-on-error: true

      - name: Build application
        run: pnpm run make

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitLabRadar-dmg
          path: out/make/*.dmg
          if-no-files-found: warn

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitLabRadar-zip
          path: out/make/zip/**/*.zip
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: GitLabRadar-dmg
          path: ./artifacts

      - name: Download ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: GitLabRadar-zip
          path: ./artifacts

      - name: List artifacts
        run: find ./artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bump-cask:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Check for tap deploy key
        id: guard
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "HOMEBREW_TAP_DEPLOY_KEY is not set -- skipping Homebrew cask bump."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download ZIP artifact
        if: steps.guard.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: GitLabRadar-zip
          path: ./artifacts

      - name: Compute version and sha256
        if: steps.guard.outputs.skip != 'true'
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP=$(find ./artifacts -name '*arm64*.zip' | head -n1)
          if [ -z "$ZIP" ]; then
            echo "No arm64 zip found in artifacts:" >&2
            find ./artifacts -type f >&2
            exit 1
          fi
          SHA=$(sha256sum "$ZIP" | awk '{print $1}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "Bumping cask to $VERSION ($SHA) from $ZIP"

      - name: Checkout tap
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: Tourniercy/homebrew-gitlabradar
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Update cask
        if: steps.guard.outputs.skip != 'true'
        run: |
          CASK=tap/Casks/gitlabradar.rb
          sed -i -E "s|^  version \".*\"|  version \"${{ steps.meta.outputs.version }}\"|" "$CASK"
          sed -i -E "s|^  sha256 \".*\"|  sha256 \"${{ steps.meta.outputs.sha256 }}\"|" "$CASK"
          echo "=== updated cask ==="
          head -6 "$CASK"

      - name: Commit and push
        if: steps.guard.outputs.skip != 'true'
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Cask already up to date; nothing to commit."
            exit 0
          fi
          git add Casks/gitlabradar.rb
          git commit -m "chore: bump gitlabradar to ${{ steps.meta.outputs.version }}"
          git push
